about.mission=Re-able humanity.
about.story.title=The Mission
about.story.p1=Provide free or ultra-low-cost, functional upper-limb assistive devices to underserved populations in South Africa and beyond through distributed 3D printing and clinical partnerships.
about.story.p2=Our goal is to help those who were born missing their fingers and hands or who have lost them due to war, natural disaster, illness or accidents.
about.story.p3=Every prosthetic is designed to be improved, adapted and shared by the global maker community. Using affordable 3D printers, prosthetics can be manufactured close to those who need them.
